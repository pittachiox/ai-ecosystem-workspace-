global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Scrape OTel Collector's Prometheus exporter (receives app metrics from OTLP)
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics

  # Scrape FastAPI app's /metrics endpoint directly (prometheus-fastapi-instrumentator)
  - job_name: "fastapi-app"
    static_configs:
      - targets: ["fastapi_app:8000"]
    metrics_path: /metrics

  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

services:
  postgres_db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlflow_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: always

  init-minio:
    image: python:3.11-slim
    depends_on:
      - minio
    volumes:
      - ./scripts:/scripts
    command: sh -c "pip install --no-cache-dir boto3 && python /scripts/create_minio_bucket.py"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKET: mlflow

  mlflow:
    image: python:3.11-slim
    command: sh -c "pip install --no-cache-dir mlflow psycopg2-binary boto3 && mlflow server --backend-store-uri postgresql://postgres:postgres@postgres_db:5432/mlflow_db --default-artifact-root s3://mlflow/ --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
      MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE: "true"
    depends_on:
      - postgres_db
      - minio
      - init-minio
    restart: always

  fastapi_app:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - "8002:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - redis
      - mlflow
    restart: always

  trainer_worker:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    environment:
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - mlflow
      - redis
    restart: always

  inference_worker:
    build:
      context: .
      dockerfile: Dockerfile.inference
    environment:
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - redis
      - mlflow
    restart: always

volumes:
  pgdata:
  minio_data:
